name: Build & Release Plugin ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin ZIP
        run: |
          chmod +x build-plugin-zip.sh
          ./build-plugin-zip.sh "${{ steps.version.outputs.VERSION }}"

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          cat <<EOF > release-notes.md
          ## Nostr Calendar Block v${VERSION}

          ### Installation
          1. Download \`nostr-calendar-block-${VERSION}.zip\` below
          2. In WordPress: **Plugins → Add New → Upload Plugin**
          3. Upload the ZIP and activate

          ### What's included
          - Gutenberg Block for displaying Nostr calendar events
          - Multiple theme support (Light, Dark, relilab, foerbico)
          - Filter toolbar with tag search, text search, and month filter
          - KIM educational level badges (NIP-AMB standard)
          - Author profile display with Nostr kind:0 resolution
          - Multiple independent instances per page
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nostr Calendar Block v${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          files: dist/nostr-calendar-block-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
